<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MONO BARRILERO — Arcade</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    background:#07070e; color:#fff; font-family:'Courier New',monospace;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; gap:8px; padding:8px; overflow:hidden; user-select:none;
  }
  canvas{
    background:#000; image-rendering:pixelated;
    border:3px solid #ff3860; border-radius:6px;
    box-shadow:0 0 26px rgba(255,56,96,.4);
    max-width:96vw; max-height:80vh; touch-action:none;
  }
  #bar{ display:flex; gap:14px; align-items:center; font-size:12px; color:#9a9ab5; letter-spacing:1px; }
  #bar b{ color:#ffd23f; }
  #mute{ background:#12121f; border:2px solid #ff3860; color:#ff3860; border-radius:6px; padding:4px 10px; font-family:inherit; cursor:pointer; }
  #pad{ display:none; gap:16px; align-items:center; margin-top:2px; }
  #dpad{ display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(3,48px); gap:4px; }
  .btn{ background:#12121f; border:2px solid #ff3860; color:#ff3860; border-radius:8px; font-size:20px; font-weight:bold; font-family:inherit; display:flex; align-items:center; justify-content:center; touch-action:none; }
  .btn:active{ background:#ff3860; color:#000; }
  #jump{ width:88px; height:88px; border-radius:50%; font-size:13px; color:#38bdf8; border-color:#38bdf8; }
  #jump:active{ background:#38bdf8; color:#000; }
  .empty{ visibility:hidden; }
  @media (pointer:coarse){ #pad{ display:flex; } }
</style>
</head>
<body>
  <canvas id="c" width="560" height="640"></canvas>
  <div id="bar">
    <span>← → mover · ↑↓ escaleras · ESPACIO saltar · el martillo rompe barriles</span>
    <button id="mute">🔊</button>
  </div>
  <div id="pad">
    <div id="dpad">
      <div class="empty"></div><div class="btn" data-k="up">▲</div><div class="empty"></div>
      <div class="btn" data-k="left">◀</div><div class="empty"></div><div class="btn" data-k="right">▶</div>
      <div class="empty"></div><div class="btn" data-k="down">▼</div><div class="empty"></div>
    </div>
    <div class="btn" id="jump" data-k="jump">SALTO</div>
  </div>

<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=560,H=640, R=11;

/* ---------------- ESCENARIO ---------------- */
// index 0 = piso, 5 = girder del mono, 6 = plataforma de la doncella
const GIR=[
  {x1:0,x2:W,y1:600,y2:576},  //0 rueda IZQ (hacia el tacho)
  {x1:0,x2:W,y1:484,y2:508},  //1 rueda DER
  {x1:0,x2:W,y1:416,y2:392},  //2 rueda IZQ
  {x1:0,x2:W,y1:300,y2:324},  //3 rueda DER
  {x1:0,x2:W,y1:232,y2:208},  //4 rueda IZQ
  {x1:0,x2:W,y1:116,y2:140},  //5 rueda DER (mono)
  {x1:180,x2:320,y1:60,y2:60},//6 plataforma doncella
];
const yAt=(g,x)=>{ let t=(x-g.x1)/(g.x2-g.x1); t=t<0?0:t>1?1:t; return g.y1+(g.y2-g.y1)*t; };
const onG=(g,x)=> x>=g.x1-4 && x<=g.x2+4;
const dir=g=> g.y2>=g.y1?1:-1;

// escaleras: {i, x, brk}  i=girder de abajo -> conecta con i+1
const LAD=[
  {i:0,x:150},{i:0,x:440},
  {i:1,x:110,brk:1},{i:1,x:300},{i:1,x:480},
  {i:2,x:200},{i:2,x:410,brk:1},
  {i:3,x:130},{i:3,x:360},
  {i:4,x:100,brk:1},{i:4,x:270},{i:4,x:470},
  {i:5,x:245},
];
const APE_X=95, GOAL_GI=6;
const DRUM={x:46, gi:0};

/* ---------------- ESTADO ---------------- */
let state='start', level=1, score=0, lives=3, hi=0, bonus=5000;
let frame=0, spawnT=0, spawnInt=150, bSpeed=1.35;
let barrels=[], fires=[], floats=[], bid=0, deathT=0, clearT=0;
let ape={throw:0, pound:0}, maidenHelp=0;
const hammers=[{gi:1,x:250},{gi:3,x:250}];
const items=[{gi:2,x:120,type:0},{gi:4,x:430,type:1}];

const P={ x:0,y:0, gi:0, st:'ground', vy:0, face:1, frame:0, baseY:0, lad:null,
         inv:0, jumped:new Set(), ham:0, hamPhase:0, hamCombo:0 };

function resetP(){ P.x=115; P.gi=0; P.st='ground'; P.vy=0; P.face=1; P.y=yAt(GIR[0],115);
  P.lad=null; P.jumped.clear(); P.ham=0; P.hamCombo=0; }

function setDiff(){ bSpeed=1.25+level*0.16; spawnInt=Math.max(72,150-level*11); }

function startGame(){ state='play'; level=1; score=0; lives=3; bonus=5000;
  barrels=[]; fires=[]; floats=[]; spawnT=60; setDiff();
  hammers.forEach(h=>h.taken=false); items.forEach(it=>it.got=false);
  resetP(); music.start(); }

function nextLevel(){ sfx.win(); score+=Math.max(0,bonus|0);
  level++; barrels=[]; fires=[]; floats=[]; bonus=5000; spawnT=50; setDiff();
  hammers.forEach(h=>h.taken=false); items.forEach(it=>it.got=false);
  resetP(); state='clear'; clearT=120; }

function die(){ if(P.inv>0||state!=='play') return; sfx.die(); state='dead'; deathT=110; }

function addScore(n,x,y,col){ score+=n; floats.push({x,y,t:38,txt:'+'+n,col:col||'#ffd23f'}); }

/* ---------------- SONIDO (chiptune original) ---------------- */
let AC=null, muted=false;
function actx(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }
function tone(f,d,type='square',v=0.14,slide){ if(muted)return; const a=actx(),o=a.createOscillator(),g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,a.currentTime); if(slide) o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+d);
  g.gain.setValueAtTime(v,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+d); }
function nz(d,v=0.2){ if(muted)return; const a=actx(),b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dd=b.getChannelData(0);
  for(let i=0;i<dd.length;i++) dd[i]=(Math.random()*2-1)*Math.pow(1-i/dd.length,2);
  const s=a.createBufferSource(); s.buffer=b; const g=a.createGain(); g.gain.value=v; s.connect(g).connect(a.destination); s.start(); }
const sfx={
  jump:()=>tone(300,.18,'square',.13,620),
  walk:()=>tone(140,.05,'square',.06),
  throw:()=>{tone(120,.16,'sawtooth',.12,60); nz(.1,.08);},
  land:()=>tone(90,.08,'square',.1),
  point:()=>{tone(660,.07,'square',.12); setTimeout(()=>tone(990,.09,'square',.12),70);},
  item:()=>{tone(523,.08,'square',.13); setTimeout(()=>tone(784,.08,'square',.13),80); setTimeout(()=>tone(1046,.12,'square',.13),160);},
  smash:()=>{nz(.14,.25); tone(200,.12,'square',.12,80);},
  ham:(hi)=>tone(hi?520:390,.07,'square',.1),
  fire:()=>tone(180,.2,'sawtooth',.09,300),
  die:()=>{tone(400,.5,'triangle',.16,60); setTimeout(()=>nz(.3,.15),200);},
  win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.14,'square',.15),i*110));},
  start:()=>{[392,523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.12,'square',.14),i*90));},
};
// música de fondo original (bajo caminante)
const music={ on:false, i:0,
  bass:[196,196,247,262,294,262,247,220],
  hamBass:[330,392,440,392,330,262,330,392],
  start(){ this.on=true; },
  tick(){ if(!this.on||muted) return;
    const speed = P.ham>0 ? 9 : 15;
    if(frame%speed===0){ const arr=P.ham>0?this.hamBass:this.bass; tone(arr[this.i%arr.length],.1,'triangle',.05); this.i++; } }
};

/* ---------------- INPUT ---------------- */
const keys={left:0,right:0,up:0,down:0,jump:0}; let jLatch=false;
const kmap={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',' ':'jump'};
function sk(k,v){ if(kmap[k]!==undefined) keys[kmap[k]]=v; }
addEventListener('keydown',e=>{ if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
  actx(); sk(e.key,1); if((state==='start'||state==='over')&&(e.key===' '||e.key==='Enter')) startGame();
  if(e.key==='m'||e.key==='M') toggleMute(); });
addEventListener('keyup',e=>{ sk(e.key,0); if(kmap[e.key]==='jump') jLatch=false; });
document.querySelectorAll('[data-k]').forEach(el=>{ const k=el.dataset.k;
  const on=e=>{e.preventDefault(); actx(); keys[k]=1; if(state==='start'||state==='over') startGame();};
  const off=e=>{e.preventDefault(); keys[k]=0; if(k==='jump') jLatch=false;};
  el.addEventListener('pointerdown',on); el.addEventListener('pointerup',off); el.addEventListener('pointerleave',off); el.addEventListener('pointercancel',off); });
cv.addEventListener('pointerdown',()=>{ actx(); if(state==='start'||state==='over') startGame(); });
const muteBtn=document.getElementById('mute');
function toggleMute(){ muted=!muted; muteBtn.textContent=muted?'🔇':'🔊'; }
muteBtn.addEventListener('click',toggleMute);

/* ---------------- BARRILES ---------------- */
function spawnBarrel(){ const wild=Math.random()<0.22;
  barrels.push({id:bid++, gi:5, x:APE_X+8, y:yAt(GIR[5],APE_X+8)-R, vx:dir(GIR[5])*bSpeed*(wild?1.15:1),
                st:'roll', tg:0, cool:0, scored:0, wild}); ape.throw=16; sfx.throw(); }
function updBarrel(b){
  if(b.st==='roll'){
    b.x+=b.vx;
    if(b.cool>0) b.cool--;
    else { for(const l of LAD){ if(l.i===b.gi-1 && Math.abs(b.x-l.x)<5){ const p=b.wild?0.9:(l.brk?0.16:0.10);
      if(Math.random()<p){ b.st='fall'; b.x=l.x; b.tg=b.gi-1; b.cool=70; break; } } } }
    if(b.st==='roll'){
      const g=GIR[b.gi];
      if(b.vx>0 && b.x>=g.x2-3){ b.st='fall'; b.x=g.x2-3; b.tg=b.gi-1; }
      else if(b.vx<0 && b.x<=g.x1+3){ b.st='fall'; b.x=g.x1+3; b.tg=b.gi-1; }
      else b.y=yAt(g,b.x)-R;
    }
    // ¿entra al tacho?
    if(b.gi===0 && b.x<DRUM.x+22 && b.x>DRUM.x-22){ b.dead=1;
      if(fires.length<maxFires() && Math.random()<0.5){ spawnFire(); } }
  } else if(b.st==='fall'){
    b.y+=4.4;
    if(b.tg<0){ if(b.y>H+30) b.dead=1; }
    else { const s=yAt(GIR[b.tg],b.x)-R; if(b.y>=s){ b.y=s; b.gi=b.tg; b.st='roll'; b.vx=dir(GIR[b.gi])*bSpeed*(b.wild?1.15:1); b.scored=0; } }
  }
}

/* ---------------- FUEGOS ---------------- */
function maxFires(){ return Math.min(4, 1+Math.floor(level/2)); }
function spawnFire(){ sfx.fire(); fires.push({gi:0, x:DRUM.x, y:yAt(GIR[0],DRUM.x)-12, vx:(Math.random()<.5?-1:1)*(0.6+level*0.05), st:'walk', hop:Math.random()*6, tg:0, cool:0}); }
function updFire(f){
  if(f.st==='walk'){
    f.hop+=0.25; f.x+=f.vx;
    const g=GIR[f.gi];
    if(f.x<=g.x1+10){ f.x=g.x1+10; f.vx=Math.abs(f.vx); }
    if(f.x>=g.x2-10){ f.x=g.x2-10; f.vx=-Math.abs(f.vx); }
    f.y=yAt(g,f.x)-12-Math.abs(Math.sin(f.hop))*5;
    if(f.cool>0) f.cool--;
    else if(Math.random()<0.02){ // decide trepar hacia el jugador
      if(P.gi>f.gi){ for(const l of LAD){ if(l.i===f.gi && !l.brk && Math.abs(f.x-l.x)<28){ f.st='climb'; f.dir=1; f.x=l.x; f.tg=f.gi+1; f.cool=50; break; } } }
      else if(P.gi<f.gi){ for(const l of LAD){ if(l.i===f.gi-1 && !l.brk && Math.abs(f.x-l.x)<28){ f.st='climb'; f.dir=-1; f.x=l.x; f.tg=f.gi-1; f.cool=50; break; } } }
    }
  } else if(f.st==='climb'){
    const s=yAt(GIR[f.tg],f.x)-12;
    f.y += f.dir<0? 1.4 : -1.4;
    if((f.dir>0 && f.y<=s)||(f.dir<0 && f.y>=s)){ f.y=s; f.gi=f.tg; f.st='walk'; f.vx=(Math.random()<.5?-1:1)*Math.abs(f.vx); }
  }
}

/* ---------------- JUGADOR ---------------- */
function findLad(gi,x,dirUp){ for(const l of LAD){ if(l.brk) continue;
  if(dirUp && l.i===gi && Math.abs(x-l.x)<14) return l;
  if(!dirUp && l.i===gi-1 && Math.abs(x-l.x)<14) return l; } return null; }

function updPlayer(){
  if(P.inv>0) P.inv--;
  if(P.ham>0){ P.ham--; if(frame%12===0){ P.hamPhase^=1; sfx.ham(P.hamPhase); }
    if(P.ham===0) P.hamCombo=0; }
  const g=GIR[P.gi];

  if(P.st==='ground'){
    let mv=0; if(keys.left)mv-=2.1; if(keys.right)mv+=2.1;
    if(mv){ P.x+=mv; P.face=Math.sign(mv); P.frame++; if(P.frame%12===0) sfx.walk(); }
    P.x=Math.max(g.x1+12,Math.min(g.x2-12,P.x)); P.y=yAt(g,P.x);
    if(P.ham===0){
      if(keys.up){ const l=findLad(P.gi,P.x,1); if(l){ P.st='climb'; P.lad=l; P.x=l.x; } }
      else if(keys.down){ const l=findLad(P.gi,P.x,0); if(l){ P.st='climb'; P.lad=l; P.x=l.x; } }
      if(keys.jump && !jLatch){ jLatch=1; P.st='jump'; P.vy=-8.6; P.baseY=P.y; P.jumped.clear(); sfx.jump(); }
    }
  } else if(P.st==='climb'){
    const l=P.lad; P.x=l.x;
    const yT=yAt(GIR[l.i+1],l.x), yB=yAt(GIR[l.i],l.x);
    if(keys.up)P.y-=1.9; if(keys.down)P.y+=1.9;
    if(P.y<=yT){ P.y=yT; P.gi=l.i+1; P.st='ground'; P.lad=null; sfx.land(); }
    else if(P.y>=yB){ P.y=yB; P.gi=l.i; P.st='ground'; P.lad=null; }
  } else if(P.st==='jump'){
    P.y+=P.vy; P.vy+=0.5;
    let mv=0; if(keys.left)mv-=2; if(keys.right)mv+=2; if(mv)P.face=Math.sign(mv);
    P.x=Math.max(g.x1+12,Math.min(g.x2-12,P.x+mv));
    const s=yAt(g,P.x); if(P.vy>0 && P.y>=s){ P.y=s; P.st='ground'; }
  }

  if(P.gi===GOAL_GI){ nextLevel(); return; }

  // martillo
  if(P.ham===0){ for(const h of hammers){ if(!h.taken && P.gi===h.gi && Math.abs(P.x-h.x)<16){ h.taken=1; P.ham=300; P.hamPhase=0; sfx.item(); floats.push({x:P.x,y:P.y-40,t:40,txt:'¡MARTILLO!',col:'#ffd23f'}); } } }
  // ítems
  for(const it of items){ if(!it.got && P.gi===it.gi && Math.abs(P.x-it.x)<16){ it.got=1; const pts=[300,500,800][it.type]||300; addScore(pts,it.x,yAt(GIR[it.gi],it.x)-24,'#7dd3fc'); sfx.item(); } }

  // colisiones barriles
  const pcx=P.x, pcy=P.y-16;
  for(const b of barrels){ const dx=Math.abs(b.x-pcx), dy=Math.abs(b.y-pcy);
    if(P.ham>0){ if(dx<24 && dy<24){ b.dead=1; P.hamCombo=Math.min(2,P.hamCombo+1); addScore([300,500,800][P.hamCombo],b.x,b.y-14,'#ff9f1c'); sfx.smash(); } }
    else { if(dx<13 && dy<15) die();
      if(P.st==='jump' && !P.jumped.has(b.id) && Math.abs(b.x-P.x)<22 && (P.y-2)<b.y && Math.abs(b.y-P.baseY)<52){ P.jumped.add(b.id); addScore(100,P.x,P.y-36); sfx.point(); } }
  }
  // colisiones fuegos
  for(let i=fires.length-1;i>=0;i--){ const f=fires[i]; const dx=Math.abs(f.x-pcx), dy=Math.abs(f.y-pcy+4);
    if(P.ham>0){ if(dx<24 && dy<24){ fires.splice(i,1); P.hamCombo=Math.min(2,P.hamCombo+1); addScore([300,500,800][P.hamCombo],f.x,f.y-14,'#ff9f1c'); sfx.smash(); continue; } }
    else { if(dx<13 && dy<15) die();
      if(P.st==='jump' && f.__jid!==P.baseY && Math.abs(f.x-P.x)<22 && (P.y-2)<f.y && Math.abs(f.y-P.baseY)<52){ f.__jid=P.baseY; addScore(100,P.x,P.y-36); sfx.point(); } }
  }
}

/* ---------------- DIBUJO ---------------- */
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w,h); }

function drawScene(){
  px(0,0,W,H,'#05050d');
  // escaleras
  for(const l of LAD){ const yb=yAt(GIR[l.i],l.x), yt=yAt(GIR[l.i+1],l.x); const col=l.brk?'#155e75':'#38bdf8';
    px(l.x-7,yt,3,yb-yt,col); px(l.x+4,yt,3,yb-yt,col);
    for(let yy=yt+6; yy<yb; yy+=11){ if(l.brk && ((yy-yt)/11|0)%2===1) continue; px(l.x-7,yy,11,3,l.brk?'#0e7490':'#7dd3fc'); } }
  // plataformas
  for(let i=0;i<GIR.length;i++){ const g=GIR[i]; const seg=8;
    for(let x=g.x1; x<g.x2; x+=seg){ const y=yAt(g,x); px(x,y,seg+1,9,'#ff3860'); px(x,y+9,seg+1,3,'#8a0f28'); if(((x-g.x1)/seg|0)%2===0) px(x+3,y+2,3,3,'#ffd23f'); }
  }
}
function drawDrum(){ const g=GIR[0], x=DRUM.x, y=yAt(g,x);
  px(x-15,y-30,30,30,'#3a3a52'); px(x-15,y-30,30,4,'#5a5a7a'); px(x-15,y-16,30,3,'#5a5a7a'); px(x-12,y-26,6,22,'#ffd23f');
  // llama
  const f=(frame>>3)&1; px(x-8,y-46,16,16,f?'#ff6b35':'#ff3860'); px(x-5,y-54,10,12,f?'#ffd23f':'#ff9f1c'); px(x-3,y-60,6,8,'#fff3b0');
}
function drawApe(){ const g=GIR[5], fx=APE_X, fy=yAt(g,fx); const th=ape.throw>0; const pd=(frame>>4)&1;
  px(fx-22,fy-40,44,32,'#4a2c14'); px(fx-16,fy-32,32,22,'#6b3f1e');
  px(fx-12,fy-29,24,15,'#c8935a');
  if(th){ px(fx-34,fy-50,13,15,'#4a2c14'); px(fx+21,fy-50,13,15,'#4a2c14'); }
  else if(pd){ px(fx-33,fy-34,12,20,'#4a2c14'); px(fx+21,fy-30,12,16,'#4a2c14'); }
  else { px(fx-33,fy-30,12,20,'#4a2c14'); px(fx+21,fy-34,12,20,'#4a2c14'); }
  px(fx-18,fy-60,36,22,'#4a2c14'); px(fx-12,fy-54,24,13,'#d9a066');
  px(fx-10,fy-56,6,4,'#2a1608'); px(fx+4,fy-56,6,4,'#2a1608');
  px(fx-9,fy-52,4,4,'#000'); px(fx+5,fy-52,4,4,'#000'); px(fx-7,fy-44,14,3,'#2a1608');
  px(fx-16,fy-8,11,8,'#4a2c14'); px(fx+5,fy-8,11,8,'#4a2c14');
}
function drawMaiden(){ const g=GIR[6], x=250, y=g.y1;
  px(x-6,y-30,12,7,'#f2c79c'); px(x-8,y-33,16,4,'#f4c542'); // pelo
  px(x-2,y-27,2,2,'#222'); px(x+2,y-27,2,2,'#222');
  px(x-7,y-23,14,10,'#ff5ea8'); // vestido
  px(x-9,y-21,4,7,'#f2c79c'); px(x+6,y-21,4,7,'#f2c79c'); // brazos
  px(x-8,y-13,6,13,'#ff5ea8'); px(x+2,y-13,6,13,'#ff5ea8');
  if(maidenHelp>0){ ctx.fillStyle='#fff'; ctx.font='bold 11px "Courier New"'; ctx.textAlign='center'; ctx.fillText('¡AUXILIO!',x,y-40); }
  // corazón
  const b=(frame>>4)&1, c=b?'#ff3860':'#ff8fb0'; const hx=x+38,hy=y-24;
  px(hx-6,hy-4,5,5,c); px(hx+2,hy-4,5,5,c); px(hx-7,hy,15,5,c); px(hx-4,hy+5,9,4,c); px(hx-2,hy+9,5,3,c);
}
function drawHammer(h){ if(h.taken)return; const y=yAt(GIR[h.gi],h.x); px(h.x-2,y-22,4,18,'#a97142'); px(h.x-8,y-26,16,8,'#c0c0d0'); px(h.x-8,y-26,16,2,'#eee'); }
function drawItem(it){ if(it.got)return; const y=yAt(GIR[it.gi],it.x)-6;
  if(it.type===0){ px(it.x-9,y-4,18,4,'#f4c542'); px(it.x-6,y-10,12,7,'#f4c542'); } // sombrero
  else { px(it.x-7,y-12,14,12,'#c65bcf'); px(it.x-4,y-15,8,4,'#c65bcf'); } } // cartera
function drawBarrel(b){ const x=b.x,y=b.y; const c=b.wild?'#4a90d9':'#b5651d', c2=b.wild?'#2a5a99':'#8a4b12', c3=b.wild?'#7db8ff':'#d98a3d';
  ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(x,y,R,R-1,0,0,7); ctx.fill();
  px(x-R+2,y-2,R*2-4,4,c2); px(x-3,y-R+2,6,R*2-4,c3);
  ctx.strokeStyle='#2a1608'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.ellipse(x,y,R,R-1,0,0,7); ctx.stroke(); }
function drawFire(f){ const x=f.x,y=f.y,fl=(frame>>2)&1;
  ctx.fillStyle=fl?'#38bdf8':'#7dd3fc'; if(f.__hot) ctx.fillStyle=fl?'#ff6b35':'#ffd23f';
  px(x-9,y-2,18,12,ctx.fillStyle); px(x-6,y-12,12,12,ctx.fillStyle); px(x-3,y-20,6,10,fl?'#fff3b0':'#e0f2fe');
  px(x-5,y-6,3,4,'#fff'); px(x+2,y-6,3,4,'#fff'); px(x-4,y-5,2,2,'#000'); px(x+3,y-5,2,2,'#000'); }
function drawPlayer(){ if(P.inv>0 && (frame>>2)&1) return;
  const x=P.x,y=P.y,f=P.face; const walk=P.st==='ground'&&(keys.left||keys.right)?(P.frame>>3)&1:0;
  px(x-8,y-30,16,5,'#e63946'); px(x-10+(f>0?2:-2),y-27,20,3,'#e63946');
  px(x-6,y-25,12,7,'#f2c79c'); px(x+(f>0?2:-4),y-23,3,3,'#222');
  px(x-8,y-18,16,10,'#f4a259');
  if(P.ham>0){ // martillo
    const up=P.hamPhase===0; if(up){ px(x-3+(f*10),y-40,6,16,'#a97142'); px(x-9+(f*10),y-44,16,8,'#c0c0d0'); }
    else { px(x+(f*14)-3,y-14,6,14,'#a97142'); px(x+(f*14)-8,y-16,16,8,'#c0c0d0'); }
    px(x-11,y-17,4,8,'#f2c79c'); px(x+7,y-17,4,8,'#f2c79c');
  } else if(P.st==='climb'){ px(x-11,y-17,4,7,'#f2c79c'); px(x+7,y-19,4,7,'#f2c79c'); }
  else { px(x-11,y-17,4,8,'#f2c79c'); px(x+7,y-17,4,8,'#f2c79c'); }
  if(P.st==='climb'){ px(x-6,y-8,4,8,'#2a6f97'); px(x+2,y-8,4,8,'#2a6f97'); }
  else if(walk){ px(x-7,y-8,5,8,'#2a6f97'); px(x+3,y-8,5,9,'#2a6f97'); }
  else { px(x-6,y-8,4,8,'#2a6f97'); px(x+2,y-8,4,8,'#2a6f97'); }
}
function drawHUD(){
  ctx.textAlign='left'; ctx.fillStyle='#ffd23f'; ctx.font='bold 15px "Courier New"';
  ctx.fillText('PUNTOS '+String(score).padStart(6,'0'),10,20);
  ctx.textAlign='center'; ctx.fillText((25*level)+'m',W/2,20);
  ctx.textAlign='right'; ctx.fillStyle='#38bdf8'; ctx.fillText('BONUS '+(bonus|0),W-10,20);
  ctx.textAlign='left'; for(let i=0;i<lives;i++){ const bx=12+i*18; px(bx,30,8,4,'#e63946'); px(bx,34,8,6,'#f4a259'); }
  if(P.ham>0){ ctx.textAlign='center'; ctx.fillStyle='#ff9f1c'; ctx.font='bold 13px "Courier New"'; ctx.fillText('★ MARTILLO '+Math.ceil(P.ham/60)+'s',W/2,44); }
}
function drawCenter(lines,sub){ px(0,0,W,H,'rgba(0,0,0,.74)'); ctx.textAlign='center';
  ctx.fillStyle='#ff3860'; ctx.font='bold 34px "Courier New"'; ctx.fillText(lines[0],W/2,H/2-46);
  ctx.fillStyle='#ffd23f'; ctx.font='bold 18px "Courier New"'; for(let i=1;i<lines.length;i++) ctx.fillText(lines[i],W/2,H/2-16+(i-1)*26);
  if(sub){ ctx.fillStyle='#9a9ab5'; ctx.font='14px "Courier New"'; ctx.fillText(sub,W/2,H/2+92); } }

/* ---------------- LOOP ---------------- */
function update(){
  frame++;
  if(maidenHelp>0) maidenHelp--; else if(Math.random()<0.006) maidenHelp=70;
  if(ape.throw>0) ape.throw--;
  music.tick();

  if(state==='play'){
    if(frame%24===0 && bonus>0){ bonus-=100; if(bonus<=0){ bonus=0; die(); } }
    spawnT--; if(spawnT<=0){ spawnBarrel(); spawnT=spawnInt+(Math.random()*40|0); }
    barrels.forEach(updBarrel); barrels=barrels.filter(b=>!b.dead);
    fires.forEach(updFire);
    updPlayer();
    floats.forEach(f=>{ f.y-=0.6; f.t--; }); floats=floats.filter(f=>f.t>0);
  } else if(state==='clear'){ clearT--; if(clearT<=0) state='play'; }
  else if(state==='dead'){ deathT--;
    P.y+= (deathT>60? -1.5 : 3); P.face=(frame>>3)&1?1:-1;
    if(deathT<=0){ lives--; if(lives<0){ hi=Math.max(hi,score); state='over'; } else { resetP(); P.inv=90; state='play'; } }
  }
}
function render(){
  drawScene(); drawDrum();
  hammers.forEach(drawHammer); items.forEach(drawItem);
  drawApe(); drawMaiden();
  barrels.forEach(drawBarrel); fires.forEach(drawFire);
  if(state!=='start') drawPlayer();
  floats.forEach(f=>{ ctx.fillStyle=f.col; ctx.font='bold 14px "Courier New"'; ctx.textAlign='center'; ctx.fillText(f.txt,f.x,f.y); });
  drawHUD();
  if(state==='start') drawCenter(['MONO BARRILERO','Rescatá a la doncella','esquivando barriles y fuego'],'ESPACIO / TOCÁ para empezar');
  if(state==='clear') drawCenter(['¡'+(25*(level-1))+'m SUPERADO!','Subiendo a los '+(25*level)+'m...']);
  if(state==='over') drawCenter(['GAME OVER','Puntaje: '+score,'Récord: '+Math.max(hi,score)],'ESPACIO / TOCÁ para reiniciar');
}
function loop(){ update(); render(); requestAnimationFrame(loop); }
resetP(); loop();
</script>
